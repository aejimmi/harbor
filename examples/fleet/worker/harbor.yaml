# Fleet role "worker". server.name is overridden per instance (worker-<fleet>-<n>).
name: worker

server:
  name: worker
  type: cax21
  location: nbg1
  ssh_key: my-key

setup:
  packages: [build-essential, ca-certificates, curl, git]
  components:
    rust: { enabled: true }

  services:
    - { name: worker, enabled: true, start: true, exec_start: /usr/local/bin/worker, restart: always }

  deploys:
    worker:
      repo: github.com/you/myapp
      steps: [cargo build --release -p worker]
      binary: target/release/worker
      install: /usr/local/bin/worker
      services: [worker]
